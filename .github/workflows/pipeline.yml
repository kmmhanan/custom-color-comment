name: VS Code Extension Pipeline

on:
  push:
    branches:
      - main

  # Manual trigger point
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  # Step 1: Check if version should be published
  check-version:
    name: Check Version
    uses: kmmhanan/workflows/.github/workflows/version-check.yml@main
    with:
      project_type: "npm"
      version_file: "package.json"
      tag_prefix: "v"
      working_directory: "."

  # Step 2: Package & publish to the VS Code Marketplace (downloads tokens internally)
  publish:
    name: Publish Extension
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    uses: kmmhanan/workflows/.github/workflows/extension-publish-vscode.yml@main
    with:
      node_version: "22"
      run_build: false
      run_tests: false
      publish_to_openvsx: false
      skip_version_check: true
      project_id: "cc-comment"
      stage: "prod"
    secrets:
      ENV_URL: ${{ secrets.ENV_URL }}

  # Step 3: Create tag
  create-tag:
    name: Create Tag
    needs: publish
    if: needs.publish.outputs.success == 'true'
    uses: kmmhanan/workflows/.github/workflows/tag-create.yml@main
    with:
      project_type: "npm"
      version_file: "package.json"
      version_prefix: "v"
      working_directory: "."

  # Step 4: Create release
  create-release:
    name: Create Release
    needs: [publish, create-tag]
    if: needs.create-tag.outputs.tag_created == 'true'
    uses: kmmhanan/workflows/.github/workflows/release-create.yml@main
    with:
      project_type: "npm"
      tag_name: ${{ needs.create-tag.outputs.tag_name }}
      version: ${{ needs.create-tag.outputs.version }}
      release_notes: |
        ### ✨ What's New
        - Extension published to the VS Code Marketplace
        - Version: ${{ needs.create-tag.outputs.version }}

        ### 🔗 Links
        - [View on Marketplace](https://marketplace.visualstudio.com/items?itemName=${{ needs.publish.outputs.extension_id }})
      prerelease: false
      draft: false
      generate_changelog: true

  # Step 5: Update version in registry
  update-version:
    name: Update Version
    needs: [create-tag, create-release]
    if: needs.create-release.result == 'success'
    uses: kmmhanan/workflows/.github/workflows/update-version.yml@main
    with:
      version: ${{ needs.create-tag.outputs.version }}
      project_id: "cc-comment"
      package_type: "node"
    secrets:
      ENV_URL: ${{ secrets.ENV_URL }}
